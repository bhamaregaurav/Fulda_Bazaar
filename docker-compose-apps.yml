version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    working_dir: /app

    command: /app/entrypoint.sh
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    depends_on:
      - mysql
    restart: always
  
  frontend:
    build: ./frontend
    ports:
      - "3000:80"  # Changed from 80:80 to 3000:80 for Nginx proxy
    depends_on:
      - backend
    restart: always

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
     # - ./database/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql_data: 