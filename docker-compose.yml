
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    working_dir: /app

    environment:
      # Defaults keep a fresh clone running with no cloud account. Set
      # STORAGE_BACKEND=s3 in .env to switch to the bucket.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      # 'dev' rebuilds the schema from the models on every boot. Local only.
      ALLOW_DEV_ENTRYPOINT: "true"
    command: ["dev"]


    depends_on:
      - mysql
    restart: always
  
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: myapp_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
     # - ./database/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql_data:
  backend_media: